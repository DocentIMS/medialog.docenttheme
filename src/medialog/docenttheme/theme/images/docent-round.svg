<!-- The Docent roundel. Supplied 2026-09-17 as docent-icon-1a.svg, with two
     changes.

     1. The <text> is outlined. The artwork asks for Source Sans 3, falling
        back through Segoe UI and system-ui - none of which is on a Linux
        box or in most CI images, so the mark drew in whatever the fallback
        list reached first: a different shape on a laptop, on a phone and in
        a PDF. A logo is the one thing on a page that has to be identical
        everywhere, and live text is the one thing in an SVG that is not.
        Outlined against Liberation Sans, which is what those machines were
        falling back to anyway; rendered beside the supplied PNG at 30px and
        120px, the two agree. Regenerate with
        scripts/outline-svg-text.py in DocentIMS.ActionItems if the mark
        ever changes.

     2. The C2PA provenance block is gone. It was 7.7 KB of the 8.4 KB file,
        on an image served with every page render, and it draws nothing.

     The circle is not filled, as before: on the cream heading band a white
     disc reads as a sticker the logo has been printed on. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="dis">
  <title>dis</title>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#8B6914" stroke-width="4" />
