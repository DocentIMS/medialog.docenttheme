<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Docent roundel, as supplied, with one change: the circle is not
       filled. The artwork ships it white, which is right on a photograph
       or a dark header and wrong here - on the cream heading band a white
       disc reads as a sticker the logo has been printed on, which is the
       thing this was asked to stop doing. Put fill="#FFFFFF" back if it
       ever needs to sit on something busy. -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#A8A8A8" stroke-width="2"/>

  <!-- The arc over the letters. -->
  <path d="M 20 35 Q 50 25 80 35"
        stroke="#A8A8A8" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- The "dis" letters are outlines, not text.

       They used to be a <text> naming Arial. Arial ships with Windows and
       macOS and with neither Linux nor most CI images, so a machine
       without it drew the mark in whatever its fallback list reached
       first - a different shape on a laptop, on a phone and in a PDF. The
       logo is the one thing on a page that has to be identical
       everywhere, and live text is the one thing in an SVG that isn't.

       Outlined against Liberation Sans, which is metric-compatible with
       Arial: same advance widths, same design targets, so nothing moved.
       Regenerate with scripts/outline-svg-text.py in DocentIMS.ActionItems
       if the wordmark ever changes. -->
  <!-- d -->
  <path d="M821 174Q771 70 688.5 25.0Q606 -20 484 -20Q279 -20 182.5 118.0Q86 256 86 536Q86 1102 484 1102Q607 1102 689.0 1057.0Q771 1012 821 914H823L821 1035V1484H1001V223Q1001 54 1007 0H835Q832 16 828.5 74.0Q825 132 825 174ZM275 542Q275 315 335.0 217.0Q395 119 530 119Q683 119 752.0 225.0Q821 331 821 554Q821 769 752.0 869.0Q683 969 532 969Q396 969 335.5 868.5Q275 768 275 542Z"
        fill="#8B6914" transform="translate(20.9844 72.0000) scale(0.023438 -0.023438)"/>
  <!-- i -->
  <path d="M143 1277V1484H424V1277ZM143 0V1082H424V0Z"
        fill="#3A9FB5" transform="translate(45.6797 72.0000) scale(0.023438 -0.023438)"/>
  <!-- s -->
  <path d="M950 299Q950 146 834.5 63.0Q719 -20 511 -20Q309 -20 199.5 46.5Q90 113 57 254L216 285Q239 198 311.0 157.5Q383 117 511 117Q648 117 711.5 159.0Q775 201 775 285Q775 349 731.0 389.0Q687 429 589 455L460 489Q305 529 239.5 567.5Q174 606 137.0 661.0Q100 716 100 796Q100 944 205.5 1021.5Q311 1099 513 1099Q692 1099 797.5 1036.0Q903 973 931 834L769 814Q754 886 688.5 924.5Q623 963 513 963Q391 963 333.0 926.0Q275 889 275 814Q275 768 299.0 738.0Q323 708 370.0 687.0Q417 666 568 629Q711 593 774.0 562.5Q837 532 873.5 495.0Q910 458 930.0 409.5Q950 361 950 299Z"
        fill="#8B6914" transform="translate(57.0156 72.0000) scale(0.023438 -0.023438)"/>
</svg>
