  <!-- Docent app-window helper: when this site is viewed inside the Docent
       Dashboard app window (chromeless: Edge app-mode shortcut or installed
       app), (1) blank the title bar's text and icon, and (2) keep navigation
       in the app window by retargeting window-opening links on click.
       Normal browser tabs are unaffected. Mirrors the kiosk-overlay viewlet
       in DocentIMS.dashboard - keep the two in sync. -->
  <script>
    (function () {
      "use strict";
      var chromeless = false;
      try {
        if (window.menubar) {
          chromeless = (window.menubar.visible === false);
        }
        if (!chromeless) {
          if (window.matchMedia) {
            if (window.matchMedia("(display-mode: standalone)").matches) { chromeless = true; }
            if (window.matchMedia("(display-mode: minimal-ui)").matches) { chromeless = true; }
            if (window.matchMedia("(display-mode: fullscreen)").matches) { chromeless = true; }
          }
        }
      } catch (e) {
        chromeless = false;
      }
      if (!chromeless) { return; }
      try {
        /* Blank the title bar text. U+2800 (braille blank) renders as an
           empty glyph but counts as a real title - an empty/whitespace one
           falls back to the app name or URL. Swap the favicon for a
           transparent pixel so the corner icon disappears too. */
        var BLANK_TITLE = "⠀";
        var enforceBlankTitle = function () {
          if (document.title !== BLANK_TITLE) {
            document.title = BLANK_TITLE;
          }
        };
        enforceBlankTitle();
        /* Site JS (e.g. the Alerts view) rewrites document.title after
           load, which would put text back in the title bar - re-blank on
           every change. Observing <head> survives the <title> node being
           replaced; the equality check above stops observer loops. */
        if (window.MutationObserver) {
          if (document.head) {
            new MutationObserver(enforceBlankTitle).observe(
              document.head, { childList: true, characterData: true, subtree: true }
            );
          }
        }
        var icons = document.querySelectorAll("link[rel*='icon']");
        var i = icons.length;
        while (i--) {
          icons[i].parentNode.removeChild(icons[i]);
        }
        var blank = document.createElement("link");
        blank.rel = "icon";
        blank.href = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        document.head.appendChild(blank);
      } catch (e2) {
        /* cosmetic only - never block the page */
      }
      document.addEventListener("click", function (ev) {
        var el = ev.target;
        if (!el.closest) { return; }
        var a = el.closest("a[target]");
        if (!a) { return; }
        if (a.getAttribute("target") === "_self") { return; }
        var href = a.getAttribute("href");
        if (!href) { return; }
        if (href.indexOf("#") === 0) { return; }
        if (href.indexOf("javascript:") === 0) { return; }
        if (href.indexOf("mailto:") === 0) { return; }
        if (href.indexOf("tel:") === 0) { return; }
        a.setAttribute("target", "_self");
      }, true);
    }());
  </script>
