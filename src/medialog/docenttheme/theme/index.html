  <!-- Restore Plone's standard toolbar widths. A retired add-on's
       stylesheet, still registered on sites built before 2026-08, zeroes
       the plone-toolbar-width variable; this block sits later in the
       document, so it wins at equal specificity. It is a no-op on a site
       built since, and can be deleted once no site serves that stylesheet
       - i.e. once every server has been rebuilt. -->
  <style>
    :root {
      --plone-toolbar-width: 220px !important;
      --plone-toolbar-width-collapsed: 60px !important;
    }
  </style>

  <!-- Docent app-window helper: when this site is viewed inside the Docent
       Dashboard app window (chromeless: Edge app-mode shortcut or installed
       app), (1) set the title bar text to the Project Short Name and blank
       the icon, and (2) keep navigation in the app window by retargeting
       window-opening links on click. Normal browser tabs are unaffected.
       Mirrors the kiosk-overlay viewlet in DocentIMS.dashboard - keep the
       two in sync. -->
  <script>
    (function () {
      "use strict";
      var chromeless = false;
      try {
        if (window.menubar) {
          chromeless = (window.menubar.visible === false);
        }
        if (!chromeless) {
          if (window.matchMedia) {
            if (window.matchMedia("(display-mode: standalone)").matches) { chromeless = true; }
            if (window.matchMedia("(display-mode: minimal-ui)").matches) { chromeless = true; }
            if (window.matchMedia("(display-mode: fullscreen)").matches) { chromeless = true; }
          }
        }
      } catch (e) {
        chromeless = false;
      }
      if (!chromeless) { return; }
      /* Suppress the "Reload site? Changes you made may not be saved."
         browser prompt in the app window: this early-registered listener
         runs first, clears any handler assigned via window.onbeforeunload,
         and stops later listeners from flagging the event. Normal tabs
         keep their unsaved-changes protection. */
      try {
        window.addEventListener("beforeunload", function (ev) {
          window.onbeforeunload = null;
          ev.stopImmediatePropagation();
        }, true);
      } catch (e9) {
        /* cosmetic only */
      }
      try {
        /* Title bar text: the Project Short Name (registry value served by
           ActionItems' public @@project-short-name endpoint). A fully blank
           title is impossible here - Edge shows URL text for cross-origin
           pages with a blank title - so a real short title is the clean
           option. Until the fetch resolves (or if the endpoint is missing)
           the normal page title stays. An observer pins the fetched value
           against site JS (e.g. the Alerts view) rewriting document.title;
           the equality check stops observer loops. */
        var appTitle = null;
        var enforceAppTitle = function () {
          if (appTitle) {
            if (document.title !== appTitle) {
              document.title = appTitle;
            }
          }
        };
        if (window.fetch) {
          fetch("/@@project-short-name", { credentials: "same-origin" })
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (text) {
              text = (text || "").trim();
              if (text) {
                appTitle = text;
                enforceAppTitle();
              }
            })
            .catch(function () { /* keep the normal title */ });
        }
        if (window.MutationObserver) {
          if (document.head) {
            new MutationObserver(enforceAppTitle).observe(
              document.head, { childList: true, characterData: true, subtree: true }
            );
          }
        }
        var icons = document.querySelectorAll("link[rel*='icon']");
        var i = icons.length;
        while (i--) {
          icons[i].parentNode.removeChild(icons[i]);
        }
        var blank = document.createElement("link");
        blank.rel = "icon";
        blank.href = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiNmZmZmZmYiIHN0cm9rZT0iI0E4QThBOCIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iMzIiIHk9IjQzIiBmb250LWZhbWlseT0iQXJpYWwsIEhlbHZldGljYSwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIzMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjYwMCI+PHRzcGFuIGZpbGw9IiM4QjY5MTQiPmQ8L3RzcGFuPjx0c3BhbiBmaWxsPSIjM0E5RkI1Ij5pczwvdHNwYW4+PC90ZXh0Pjwvc3ZnPgo=";
        document.head.appendChild(blank);
      } catch (e2) {
        /* cosmetic only - never block the page */
      }
      document.addEventListener("click", function (ev) {
        var el = ev.target;
        if (!el.closest) { return; }
        var a = el.closest("a[target]");
        if (!a) { return; }
        if (a.getAttribute("target") === "_self") { return; }
        var href = a.getAttribute("href");
        if (!href) { return; }
        if (href.indexOf("#") === 0) { return; }
        if (href.indexOf("javascript:") === 0) { return; }
        if (href.indexOf("mailto:") === 0) { return; }
        if (href.indexOf("tel:") === 0) { return; }
        a.setAttribute("target", "_self");
      }, true);
    }());
  </script>
