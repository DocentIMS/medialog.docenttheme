[theme]
title = Plone Theme: Docent ims theme
description = A Diazo based Plone theme
preview = preview.png
rules = /++theme++docent-ims-theme/rules.xml
prefix = /++theme++docent-ims-theme
doctype = <!DOCTYPE html>

enabled-bundles =
disabled-bundles =

production-css = ++theme++docent-ims-theme/styles/theme.min.css
tinymce-content-css = /++theme++docent-ims-theme/styles/theme.min.css

# production-js = ++theme++docent-ims-theme/js/theme-compiled.js

#[theme:overrides]
#directory = template-overrides

[theme:parameters]
portal_url = python: portal.absolute_url()
# Changes when any stylesheet in theme/styles/ changes, and only then. The
# rules put it in the stylesheet URL so a deploy reaches browsers without
# anyone hard-refreshing. See browser/css_version.py for why that is needed.
css_version = python: portal.restrictedTraverse('@@docent-css-version')()
